name: Deploy Client

on:
  push:
    branches: [main, Mine-ThunderClient, V2]
    paths:
      - 'client/**'
      - '.github/workflows/deploy-client.yml'

jobs:
  deploy:
    name: Deploy Client Application
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Trigger Render Client Deployment
        if: env.RENDER_CLIENT_SERVICE_ID != ''
        uses: johnbeynon/render-deploy-action@v0.0.8
        with:
          service-id: ${{ secrets.RENDER_CLIENT_SERVICE_ID }}
          api-key: ${{ secrets.RENDER_API_KEY }}
        env:
          RENDER_CLIENT_SERVICE_ID: ${{ secrets.RENDER_CLIENT_SERVICE_ID }}
