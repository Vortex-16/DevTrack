version: '3.8'

services:
  # Express Backend API Server
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "9000:9000"
    environment:
      - NODE_ENV=development
      - PORT=9000
      - REDIS_URL=redis://redis:6379
    env_file:
      - ./server/.env
    depends_on:
      - redis
    restart: unless-stopped

  # Vite React Client SPA
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    env_file:
      - ./client/.env
    restart: unless-stopped

  # Redis Cache & Quota Service
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  # Nginx Reverse Proxy (Dev Router)
  nginx:
    image: nginx:alpine
    ports:
      - "8080:8080"
    volumes:
      - ./nginx/nginx.dev.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - server
      - client
    restart: unless-stopped

volumes:
  redis_data:
